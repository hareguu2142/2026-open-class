<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 공개수업</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d2433; --muted:#667085; --line:#e4e7ec; --accent:#3559e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --text:#e8eaf0; --muted:#98a2b3; --line:#2a303c; --accent:#7d9bff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:28px; margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 32px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  a.card { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:20px; background:var(--card);
           border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .title { font-weight:600; font-size:17px; }
  .name { color:var(--muted); font-size:14px; margin-top:4px; }
  .arrow { color:var(--accent); font-size:20px; }
</style>
</head>
<body>
<main>
  <h1>2026 공개수업</h1>
  <p class="sub">학생 작품 모음</p>
  <ul>
    <li><a class="card" href="박서현.html"><div><div class="title">내 냉장고 한 끼 추천</div><div class="name">박서현</div></div><span class="arrow">→</span></a></li>
    <li><a class="card" href="박현주.html"><div><div class="title">뇌의 반응속도 러닝</div><div class="name">박현주</div></div><span class="arrow">→</span></a></li>
    <li><a class="card" href="신연재.html"><div><div class="title">과학실 예약 시스템</div><div class="name">신연재</div></div><span class="arrow">→</span></a></li>
  </ul>
</main>
</body>
</html>
