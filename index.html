<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 공개수업</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d2433; --muted:#667085; --line:#e4e7ec; --accent:#3559e0; --accent-soft:#eef2ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --text:#e8eaf0; --muted:#98a2b3; --line:#2a303c; --accent:#7d9bff; --accent-soft:#222a40; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:28px; margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  nav.classes { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:6px; margin:0 0 24px;
                background:var(--card); border:1px solid var(--line); border-radius:14px; position:sticky; top:12px; z-index:1; }
  nav.classes a { text-align:center; padding:10px 0; border-radius:10px; color:var(--muted); text-decoration:none; font-weight:600; font-size:15px; }
  nav.classes a:hover { color:var(--text); }
  nav.classes a.on { background:var(--accent); color:#fff; }
  section h2 { font-size:20px; margin:0 0 12px; }
  section + section { margin-top:40px; }
  body.js section:not(.on) { display:none; }
  body.js section + section { margin-top:0; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  .card { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:20px; background:var(--card);
          border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .card.wip { border-style:dashed; }
  .card.wip .title { color:var(--muted); }
  .title { font-weight:600; font-size:17px; }
  .name { color:var(--muted); font-size:14px; margin-top:4px; line-height:1.5; }
  .name b { color:var(--text); font-weight:600; }
  .team { color:var(--accent); font-size:13px; font-weight:600; margin-bottom:4px; }
  .arrow { color:var(--accent); font-size:20px; }
  .badge { flex-shrink:0; font-size:12px; color:var(--muted); background:var(--accent-soft); padding:4px 10px; border-radius:99px; }
</style>
</head>
<body>
<main>
  <h1>2026 공개수업</h1>
  <p class="sub">학생 작품 모음</p>
  <nav class="classes" id="nav"></nav>
  <div id="list"></div>
</main>
<script>
// 작품이 추가되면 해당 모둠에 title과 file을 채워 주세요. (file은 반 폴더 안의 파일 이름, 외부 링크면 file 대신 url)
const classes = [
  { name: '1반', teams: [
    { leader: '신연재', members: ['한성윤','김도연','노민아','이지원','정아연'], title: '과학실 예약 시스템', file: '신연재.html' },
    { leader: '박현주', members: ['오인영','김수현','여채원','이지민'], title: '뇌의 반응속도 러닝', file: '박현주.html' },
    { leader: '박서현', members: ['김시윤','박서진','시윤서','이보미'], title: '내 냉장고 한 끼 추천', file: '박서현.html' },
    { leader: '김우경', members: ['손정희','김윤슬','양소원','채윤아'], title: '오늘의 메뉴 추천 Pro', file: '김우경.html' },
  ]},
  { name: '2반', teams: [
    { leader: '정지수', members: ['박서아','박소연','배근해','서혜원'], title: 'STUDYMATCH 공부 유형 테스트', file: '박서아.html' },
    { leader: '배소현', members: ['백경민','김유진','이서원'], title: '우리반.zip 학교생활 커뮤니티', file: '배소현.html' },
    { leader: '김미정', members: ['손민지','배윤아','이지민'], title: '진로드 익명 진로 상담소', file: '김미정.html' },
    { leader: '임현지', members: ['박나현','이수민'], title: '브리지 빌더', file: '임현지.html' },
  ]},
  { name: '3반', teams: [
    { leader: '김채윤', members: ['김민서','김미정','송예진','이다현','최다경'], title: '학급관리 상벌점 관리자', url: 'https://app.baze.co/public/artifacts/yPyG2HiIVVL_' },
    { leader: '서예슬', members: ['권민송','배서현','김연서','정윤주','이채윤'], title: '우유먹었니?', url: 'https://project-tan-pi.vercel.app/' },
    { leader: '노하윤', members: ['이채원','정세진','강연선','디아나'], title: '나만의 비밀친구', url: 'https://ais-pre-4dh5exotjyaxqxinne6pr2-172995917119.asia-east1.run.app/' },
    { leader: '주민서', members: ['구예은','권미진','서은우','여채원','정예지'], title: '학교 분실물 & 과제 관리 시스템', file: '주민서조.html' },
  ]},
  { name: '4반', teams: [
    { leader: '장수민', members: ['도혜련','박다혜','김민주','황가은','구하린'], title: '나의 삶 체크리스트', file: '구하린.html' },
    { leader: '김민희', members: ['김시현','이선','정서영','구효선'], title: '민희 키우기', file: '민희키우기.html' },
    { leader: '정지연', members: ['이승현','정시후','김영은','구나윤'], title: '금쪽같은 내 식사', file: '정지연조.html' },
    { leader: '백예진', members: ['강윤아','안정민','김보민','전효은','김지현'], title: '해골 — 해결해주고 골라드립니다', file: '백예진.html' },
  ]},
];

const nav = document.getElementById('nav');
const list = document.getElementById('list');

nav.innerHTML = classes.map(c => `<a href="#${c.name}">${c.name}</a>`).join('');
list.innerHTML = classes.map(c => `
  <section id="${c.name}">
    <h2>${c.name}</h2>
    <ul>${c.teams.map((t, i) => {
      const body = `<div><div class="team">${i + 1}모둠</div><div class="title">${t.title || '작품 준비 중'}</div>`
                 + `<div class="name"><b>${t.leader}</b> · ${t.members.join(' · ')}</div></div>`;
      if (t.url) return `<li><a class="card" href="${t.url}" target="_blank" rel="noopener">${body}<span class="arrow">↗</span></a></li>`;
      return t.file
        ? `<li><a class="card" href="${encodeURI(c.name + '/' + t.file)}">${body}<span class="arrow">→</span></a></li>`
        : `<li><div class="card wip">${body}<span class="badge">준비 중</span></div></li>`;
    }).join('')}</ul>
  </section>`).join('');

document.body.classList.add('js');
function show() {
  const want = decodeURIComponent(location.hash.slice(1));
  let cur = '1반';
  try { cur = classes.some(c => c.name === want) ? want : (localStorage.getItem('class') || '1반'); } catch (e) {}
  try { localStorage.setItem('class', cur); } catch (e) {}
  document.querySelectorAll('#list section').forEach(s => s.classList.toggle('on', s.id === cur));
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', decodeURIComponent(a.hash.slice(1)) === cur));
}
nav.addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  e.preventDefault(); history.replaceState(null, '', a.hash); show();
});
window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
