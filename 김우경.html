    padding: 10px 14px;
    border: 2px solid #ffecd2;
    border-radius: 10px;
    font-size: 1em;
    outline: none;
    transition: border-color .2s;
    background: #fff;
  }
  input[type="text"]:focus, select:focus { border-color: #d35400; }
  button {
    padding: 10px 20px;
    background: #d35400;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1em;
    cursor: pointer;
    transition: transform .15s, background .2s;
  }
  button:hover { background: #e67e22; transform: translateY(-2px); }
  button.secondary { background: #7f8c8d; }
  button.secondary:hover { background: #95a5a6; }
  button.diet-toggle { background: #27ae60; }
  button.diet-toggle.active { background: #16a085; box-shadow: 0 0 0 3px rgba(39,174,96,0.3); }

  .chip {
    padding: 6px 12px;
    background: #fff8f0;
    border: 1px solid #ffecd2;
    border-radius: 20px;
    font-size: .85em;
    cursor: pointer;
    user-select: none;
    transition: all .2s;
  }
  .chip:hover { background: #ffecd2; }
  .chip.active { background: #d35400; color: #fff; border-color: #d35400; }

    padding: 20px;

    border-radius: 20px;
    font-size: .8em;
  }
  .tag.cat { background: #ffecd2; color: #d35400; }
  .tag.sub { background: #e8f5e9; color: #27ae60; }
  .tag.diet { background: #e3f2fd; color: #1976d2; }

  .nutrition div {
    background: #fff8f0;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    border: 1px solid #ffecd2;

  .nutrition .value { font-size: 1.2em; font-weight: bold; color: #d35400; }
  .nutrition.lowcal .value { color: #27ae60; }
  .nutrition.highcal .value { color: #c0392b; }

  .star { color: #ddd; transition: color .2s; }
  .star.active { color: #f39c12; }

let currentShops = [];
let map = null;
let markers = [];

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) return JSON.parse(raw);
  return {
    ratings: {},
    history: [],
    recentIds: [],
    apiKey: ''
  };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ============ API 키 관리 ============ */
function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { alert('API 키를 입력해주세요'); return; }
  state.apiKey = key;
  saveState();
  loadKakaoMap(key);
}

function loadKakaoMap(key) {
  document.getElementById('apiKeyStatus').innerHTML = '⏳ 지도 로딩 중...';
  // 이미 스크립트가 로드되어 있는지 확인
  if (window.kakao && window.kakao.maps) {
    document.getElementById('apiKeyStatus').innerHTML = '✅ 지도 로드 완료!';
    initMap();
    if (currentShops.length > 0) renderMap();
    return;
  }
  const script = document.createElement('script');
  script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&autoload=false`;
  script.onload = () => {
    window.kakao.maps.load(() => {
      document.getElementById('apiKeyStatus').innerHTML = '✅ 지도 로드 완료!';
      initMap();
      if (currentShops.length > 0) renderMap();
    });
  };
  script.onerror = () => {
    document.getElementById('apiKeyStatus').innerHTML = '❌ 키가 잘못되었거나 로드 실패';
  };
  document.head.appendChild(script);
}

function initMap() {
  const mapContainer = document.getElementById('map');
  if (!window.kakao || !window.kakao.maps) return;
  // 지도 영역은 추천 결과가 나와야 생기므로, 없으면 나중에 만든다
  if (!mapContainer) return;
  map = new window.kakao.maps.Map(mapContainer, {
    center: new window.kakao.maps.LatLng(37.5665, 126.9780),
    level: 6
  });
}

/* ============ 추천 로직 ============ */
function recommendMenu() {
  const category = document.getElementById('categoryFilter').value;
  const location = document.getElementById('locationInput').value.trim();

  let candidates = MENUS.filter(m => {
    // 카테고리 필터
    if (category) {
      const [mainCat, subCat] = category.split('-');
      if (m.category !== mainCat) return false;
      if (subCat && m.sub !== subCat) return false;
    }
    // 칼로리 필터
    if (calFilter === 'low' && m.kcal > 400) return false;
    if (calFilter === 'mid' && (m.kcal < 400 || m.kcal > 650)) return false;
    if (calFilter === 'high' && m.kcal < 650) return false;
    // 다이어트 모드
    if (dietMode && !m.diet && m.kcal > 450) return false;
    return true;
  });

  // 최근 추천 제외
  candidates = candidates.filter(m => !state.recentIds.includes(m.id));
  if (candidates.length === 0) {
    candidates = MENUS.filter(m => {
      if (category) {
        const [mainCat, subCat] = category.split('-');
        if (m.category !== mainCat) return false;
        if (subCat && m.sub !== subCat) return false;
      }
      return true;
    });
    state.recentIds = [];
  }

  // 가중치 계산
  const weighted = candidates.map(m => {
    const ratings = state.ratings[m.id] || [];
    let base = ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : 3;
    // 다이어트 모드: 저칼로리 보너스
    if (dietMode) {
      base += (600 - m.kcal) / 100;
    }
    return { menu: m, weight: base + Math.random() * 1.5 };
  });

  weighted.sort((a,b) => b.weight - a.weight);
  const picked = weighted[0].menu;

  state.recentIds.push(picked.id);
  if (state.recentIds.length > 5) state.recentIds.shift();

  state.history.unshift({
    id: picked.id, name: picked.name, category: picked.category, sub: picked.sub,
    kcal: picked.kcal, date: new Date().toLocaleString('ko-KR'), rating: null
  });
  if (state.history.length > 30) state.history.pop();
  saveState();

  renderRecommendation(picked, location);
  renderHistory();
  renderStats();
}

/* ============ 렌더링 ============ */
function renderRecommendation(menu, location) {
  currentMenu = menu;
  const area = document.getElementById('recommendationArea');
  currentShops = findShops(menu, location);
  const ratings = state.ratings[menu.id] || [];
  const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '-';

  const calClass = menu.kcal <= 400 ? 'lowcal' : (menu.kcal >= 650 ? 'highcal' : '');

  area.innerHTML = `
    <div class="menu-card">
      <div class="menu-tags">
        <span class="tag cat">${menu.category}</span>
        <span class="tag sub">${menu.sub}</span>
        ${menu.diet ? '<span class="tag diet">🥗 다이어트 추천</span>' : ''}
      </div>
      <div class="menu-name">${menu.name}</div>
      <div class="nutrition">
        <div class="${calClass}"><div class="label">칼로리</div><div class="value">${menu.kcal}kcal</div></div>
        <div><div class="label">단백질</div><div class="value">${menu.protein}g</div></div>
        <div><div class="label">탄수화물</div><div class="value">${menu.carb}g</div></div>
        <div><div class="label">지방</div><div class="value">${menu.fat}g</div></div>
      </div>
      <div>
        <strong>평균 평점:</strong> <span class="rating-badge">⭐ ${avgRating} (${ratings.length}명)</span>
        <div style="margin-top:10px;">
          <span>나의 평점: </span>
          <span class="stars" id="starRating">
            ${[1,2,3,4,5].map(n => `<span class="star" data-val="${n}">★</span>`).join('')}
          </span>
          <button onclick="submitRating(${menu.id})" style="margin-left:10px;">평가 등록</button>
        </div>
      </div>
      <div class="shops">
        <strong>📍 주변 가게 (${currentShops.length}곳)</strong>
        ${currentShops.length ? currentShops.map((s, i) => `
          <div class="shop-item" onclick="focusShop(${i})">
            <div class="shop-name">${s.name}</div>
            <div class="shop-info">${s.region} · 클릭하면 지도에서 강조</div>
          </div>
        `).join('') : '<div class="empty">해당 지역의 등록된 가게가 없어요</div>'}
      </div>
      <div id="map"></div>
      ${menu.diet ? '<div class="notice diet">🥗 다이어트 친화적 메뉴예요! 단백질이 풍부하고 칼로리가 낮아요.</div>' : ''}
      <div class="notice info">💡 가게 항목을 클릭하면 지도에서 해당 위치로 이동합니다.</div>
    </div>
  `;

  // 별점 이벤트
  document.querySelectorAll('#starRating .star').forEach(star => {
    star.addEventListener('click', () => {
      const val = parseInt(star.dataset.val);
      document.querySelectorAll('#starRating .star').forEach(s => {
        s.classList.toggle('active', parseInt(s.dataset.val) <= val);
      });
      document.getElementById('starRating').dataset.current = val;
    });
  });

  // 지도 렌더
  if (map) {
    renderMap();
  } else if (state.apiKey) {
    loadKakaoMap(state.apiKey);
  } else {
    document.getElementById('map').innerHTML = '<div style="text-align:center;padding:20px;">🔑 상단에서 카카오맵 API 키를 입력하면 지도가 표시됩니다.</div>';
  }
}

function renderMap() {
  if (!map || !window.kakao) return;
  // 기존 마커 제거
  markers.forEach(m => m.setMap(null));
  markers = [];

  if (currentShops.length === 0) {
    document.getElementById('map').innerHTML = '<div style="text-align:center;padding:20px;">📍 표시할 가게가 없어요</div>';
    return;
  }

  // 지도 컨테이너 복원 (innerHTML로 덮어써졌을 수 있음)
  const mapEl = document.getElementById('map');
  if (!mapEl.querySelector('div[class*="map"]') && mapEl.childElementCount === 0) {
    // 지도 재생성 필요
    map = new window.kakao.maps.Map(mapEl, {
      center: new window.kakao.maps.LatLng(currentShops[0].lat, currentShops[0].lng),
      level: 5
    });
  }

  const bounds = new window.kakao.maps.LatLngBounds();
  currentShops.forEach((shop, i) => {
    const position = new window.kakao.maps.LatLng(shop.lat, shop.lng);
    const marker = new window.kakao.maps.Marker({
      map: map,
      position: position,
      title: shop.name
    });
    const infowindow = new window.kakao.maps.InfoWindow({
      content: `<div style="padding:6px 10px;font-size:.9em;white-space:nowrap;"><strong>${shop.name}</strong><br><span style="color:#666;">${shop.region}</span></div>`
    });
    window.kakao.maps.event.addListener(marker, 'click', () => {
      infowindow.open(map, marker);
    });
    markers.push(marker);
    markers[i]._infowindow = infowindow;
    bounds.extend(position);
  });
  map.setBounds(bounds);
}

function focusShop(idx) {
  if (!map || !markers[idx]) return;
  const shop = currentShops[idx];
  const position = new window.kakao.maps.LatLng(shop.lat, shop.lng);
  map.setCenter(position);
  map.setLevel(3);
  if (markers[idx]._infowindow) {
    markers[idx]._infowindow.open(map, markers[idx]);
  }
}

function findShops(menu, location) {
  const result = [];
  const loc = location || '';
  SHOPS.forEach(shop => {
    if (!shop.menuIds.includes(menu.id)) return;
    if (!loc) {
      result.push(shop);
    } else {
      // 위치 문자열 매칭 (포함 관계)
      if (shop.region.includes(loc) || loc.includes(shop.region) ||
          shop.region.split(' ').some(part => loc.includes(part))) {
        result.push(shop);
      }
    }
  });
  // 위치 미입력 시 최대 5개만
  if (!loc) return result.slice(0, 5);
  return result;
}

function submitRating(menuId) {
  const val = parseInt(document.getElementById('starRating').dataset.current);
  if (!val) { alert('별점을 선택해주세요'); return; }
  if (!state.ratings[menuId]) state.ratings[menuId] = [];
  state.ratings[menuId].push(val);
  const latest = state.history.find(h => h.id === menuId && h.rating === null);
  if (latest) latest.rating = val;
  saveState();
  alert(`⭐ ${val}점 평가가 등록되었어요! 다음 추천에 반영됩니다.`);
  renderHistory();
  renderStats();
}

function renderHistory() {
  const area = document.getElementById('historyArea');
  if (state.history.length === 0) {
    area.innerHTML = '<div class="empty">아직 추천 기록이 없어요</div>';
    return;
  }
  area.innerHTML = state.history.map(h => `
    <div class="history-item">
      <div>
        <strong>${h.name}</strong>
        <div style="font-size:.85em;color:#888;">${h.category} · ${h.sub} · ${h.kcal}kcal · ${h.date}</div>
      </div>
      <div>
        ${h.rating ? `<span class="rating-badge">⭐ ${h.rating}점</span>` : '<span style="color:#bbb;">미평가</span>'}
      </div>
    </div>
  `).join('');
}

function renderStats() {
  const area = document.getElementById('statsArea');
  const categoryStats = {};
  MENUS.forEach(m => {
    const ratings = state.ratings[m.id] || [];
    if (ratings.length === 0) return;
    if (!categoryStats[m.category]) categoryStats[m.category] = { total: 0, count: 0 };
    categoryStats[m.category].total += ratings.reduce((a,b)=>a+b,0);
    categoryStats[m.category].count += ratings.length;
  });

  if (Object.keys(categoryStats).length === 0) {
    area.innerHTML = '<div class="empty">평점을 남겨주시면 취향을 분석해드려요</div>';
    return;
  }

  const sorted = Object.entries(categoryStats)
    .map(([cat, v]) => ({ cat, avg: (v.total/v.count).toFixed(2), count: v.count }))
    .sort((a,b) => b.avg - a.avg);

  const totalKcal = state.history.reduce((sum, h) => sum + (h.kcal || 0), 0);
  const avgKcal = state.history.length ? Math.round(totalKcal / state.history.length) : 0;

  area.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;">
      ${sorted.map(s => `
        <div style="background:#fff8f0;padding:14px;border-radius:10px;text-align:center;border:1px solid #ffecd2;">
          <div style="font-size:.9em;color:#888;">${s.cat}</div>
          <div style="font-size:1.5em;color:#d35400;font-weight:bold;">⭐ ${s.avg}</div>
          <div style="font-size:.8em;color:#aaa;">${s.count}회 평가</div>
        </div>
      `).join('')}
    </div>
    <div style="margin-top:14px;padding:12px;background:#fff8f0;border-radius:10px;">
      <strong>📊 평균 섭취 칼로리:</strong> <span style="color:#d35400;font-weight:bold;font-size:1.2em;">${avgKcal} kcal</span>
      <span style="color:#888;font-size:.85em;">/ 추천 1회당</span>
    </div>
    <div class="notice" style="margin-top:14px;">
      💡 <strong>${sorted[0].cat}</strong> 카테고리를 가장 선호하시는군요!
    </div>
  `;
}

/* ============ 필터/모드 ============ */
function setCalFilter(val) {
  calFilter = val;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cal === val);
  });
}

function toggleDietMode() {
  dietMode = !dietMode;
  const btn = document.getElementById('dietToggle');
  btn.classList.toggle('active', dietMode);
  const badge = document.getElementById('modeBadge');
  badge.innerHTML = dietMode ? '<span class="mode-indicator diet">🥗 다이어트 모드 ON</span>' : '';
}

function clearHistory() {
  if (!confirm('모든 추천 기록과 평점을 초기화할까요?')) return;
  const apiKey = state.apiKey;
  state = { ratings: {}, history: [], recentIds: [], apiKey };
  saveState();
  renderHistory();
  renderStats();
  document.getElementById('recommendationArea').innerHTML = '';
  alert('초기화 완료!');
}

/* ============ 초기화 ============ */
window.addEventListener('DOMContentLoaded', () => {
  if (state.apiKey) {
    document.getElementById('apiKeyInput').value = state.apiKey;
    loadKakaoMap(state.apiKey);
  }
  renderHistory();
  renderStats();
});
</script>
</body>
</html>
